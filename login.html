<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Cadastro | NextTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        .left-side {
            flex: 1;
            background: linear-gradient(rgba(11, 15, 25, 0.4), rgba(11, 15, 25, 0.8)), url('neymar.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            position: relative;
        }

        .logo-left { font-size: 1.8rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; z-index: 2; }
        .logo-left span { color: var(--accent-color); }

        .right-side {
            width: 480px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem;
            overflow-y: auto;
        }

        .form-container { display: none; }
        .form-container.active { display: block; }

        h3 { font-size: 1.6rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .form-control { width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: #1a2234; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: var(--accent-color); }
        
        label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 4px; }

        .remember-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .remember-container input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--accent-color); color: white; border: none; padding: 0.9rem; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem; transition: background 0.3s; margin-top: 0.5rem; }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .link-acao { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .link-acao a { color: var(--accent-color); text-decoration: none; font-weight: 600; cursor: pointer; }
        .link-acao a:hover { text-decoration: underline; }

        #toast-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="left-side">
        <div class="logo-left"><i class="fa-solid fa-microchip"></i> Next<span>Tech</span></div>
        <div style="z-index: 2;">
            <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">Conecte-se com o <br>futuro agora.</h2>
            <p style="color: var(--text-muted);">A maior loja de eletrônicos do Brasil.</p>
        </div>
    </div>

    <div class="right-side">
        <!-- FORM LOGIN -->
        <div id="form-login" class="form-container active">
            <h3>Bem-vindo de volta</h3>
            <p class="subtitle">Faça login para continuar suas compras.</p>
            <label>E-mail</label>
            <input type="email" id="login-email" class="form-control" placeholder="nome@exemplo.com">
            <label>Senha</label>
            <input type="password" id="login-senha" class="form-control" placeholder="••••••••">
            <label class="remember-container">
                <input type="checkbox"> Lembrar de mim
            </label>
            <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
            <p class="link-acao">Ainda não tem uma conta? <a onclick="trocarForm('cadastro')">Cadastre-se</a></p>
        </div>

        <!-- FORM CADASTRO -->
        <div id="form-cadastro" class="form-container">
            <h3>Crie sua conta</h3>
            <p class="subtitle">Junte-se à NextTech e aproveite as ofertas.</p>
            <label>Nome Completo</label>
            <input type="text" id="cad-nome" class="form-control" placeholder="Seu nome">
            <label>E-mail</label>
            <input type="email" id="cad-email" class="form-control" placeholder="nome@exemplo.com">
            <label>Senha</label>
            <input type="password" id="cad-senha" class="form-control" placeholder="••••••••">
            <button class="btn-primary" onclick="fazerCadastro()">Criar Conta</button>
            <p class="link-acao">Já possui conta? <a onclick="trocarForm('login')">Entrar</a></p>
        </div>
    </div>

    <script>
        function trocarForm(tipo) {
            document.getElementById('form-login').classList.remove('active');
            document.getElementById('form-cadastro').classList.remove('active');
            document.getElementById('form-' + tipo).classList.add('active');
        }

        function mostrarToast(mensagem, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            div.style.background = tipo === 'success' ? '#10b981' : '#ef4444';
            div.style.color = 'white';
            div.style.padding = '12px 24px';
            div.style.borderRadius = '8px';
            div.style.marginBottom = '10px';
            div.style.fontWeight = '600';
            div.innerText = mensagem;
            container.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function fazerCadastro() {
            let nome = document.getElementById('cad-nome').value.trim();
            let email = document.getElementById('cad-email').value.trim();
            let senha = document.getElementById('cad-senha').value.trim();

            if(!nome || !email || !senha) { mostrarToast('Preencha todos os campos!', 'error'); return; }

            let usuarios = JSON.parse(localStorage.getItem('usuarios_nexttech')) || [];
            if(usuarios.some(u => u.email === email)) { mostrarToast('Este e-mail já está cadastrado!', 'error'); return; }

            usuarios.push({ nome, email, senha, carrinho: [], dataCadastro: new Date().toLocaleString() });
            localStorage.setItem('usuarios_nexttech', JSON.stringify(usuarios));
            mostrarToast('Conta criada com sucesso!');
            trocarForm('login');
        }

        function fazerLogin() {
            let email = document.getElementById('login-email').value.trim();
            let senha = document.getElementById('login-senha').value.trim();
            let usuarios = JSON.parse(localStorage.getItem('usuarios_nexttech')) || [];
            
            let usuario = usuarios.find(u => u.email === email && u.senha === senha);
            if(usuario) {
                localStorage.setItem('usuario_logado', JSON.stringify(usuario));
                mostrarToast('Login efetuado com sucesso!');
                window.location.href = 'index.html';
            } else {
                mostrarToast('Credenciais inválidas!', 'error');
            }
        }
    </script>
</body>
</html>
